<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Video Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body, html {
      overflow: hidden; margin: 0; padding: 0;
      background-color: black; width: 100%; height: 100%;
      font-family: sans-serif;
    }

    .video-container {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
      cursor: pointer;
    }

    #bgVideo {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: blur(20px) brightness(0.5);
      transform: scale(1.1);
      z-index: 1;
    }

    #fgVideo {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      transition: object-fit 0.3s ease;
      pointer-events: none;
    }

    #ui-layer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10; display: none;
      pointer-events: none;
    }

    #big-play {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100px; height: 100px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; display: flex;
      justify-content: center; align-items: center;
    }

    .triangle {
      width: 0; height: 0;
      border-top: 15px solid transparent; border-bottom: 15px solid transparent;
      border-left: 25px solid white; margin-left: 8px;
    }

    #status-indicator {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20%;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .status-icon {
      width: 50px; height: 50px; fill: white;
    }
  </style>
</head>
<body>

  <div class="video-container" id="mainContainer">
    <video id="bgVideo" muted playsinline></video>
    <video id="fgVideo" playsinline></video>

    <div id="status-indicator">
        <svg id="status-svg" class="status-icon" viewBox="0 0 24 24"></svg>
    </div>

    <div id="ui-layer">
      <div id="big-play"><div class="triangle"></div></div>
    </div>
  </div>

  <script>
    const fg = document.getElementById("fgVideo");
    const bg = document.getElementById("bgVideo");
    const container = document.getElementById("mainContainer");
    const uiLayer = document.getElementById("ui-layer");
    const statusDiv = document.getElementById("status-indicator");
    const statusSvg = document.getElementById("status-svg");

    let videoSource = [];
    let ii = 0;
    let muted = false;
    let statusTimeout = null;
    let fallbackTimeout = null;

    const icons = {
      on:  '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>',
      off: '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
    };

    function flashStatus(type) {
      if (statusTimeout) clearTimeout(statusTimeout);
      statusSvg.innerHTML = icons[type];
      statusDiv.style.opacity = "1";
      statusTimeout = setTimeout(() => {
        statusDiv.style.opacity = "0";
      }, 1200);
    }

    function getUrlParameters(queryStr) {
      const params = {};
      const pairs = queryStr.split('&');
      for (let i = 0; i < pairs.length; i++) {
        const pair = pairs[i].split('=');
        if (pair[0]) params[pair[0]] = decodeURIComponent((pair[1] || '').replace(/\+/g, " "));
      }
      return params;
    }

    function updateAspect() {
      const screenRatio = window.innerWidth / window.innerHeight;
      const videoRatio = fg.videoWidth / fg.videoHeight || 16/9;
      if (Math.abs(screenRatio - videoRatio) / videoRatio < 0.20) {
        fg.style.objectFit = 'cover'; 
        bg.style.display = 'none';
      } else {
        fg.style.objectFit = 'contain'; 
        bg.style.display = 'block';
      }
    }

    async function videoPlay(num) {
      if (!videoSource || videoSource.length === 0) return;
      if (fallbackTimeout) clearTimeout(fallbackTimeout);

      ii = num;
      fg.src = videoSource[num];
      bg.src = videoSource[num];

      fg.muted = muted;

      try {
        await fg.play();
        uiLayer.style.display = 'none';
        bg.play().catch(() => {});
      } catch (e) {
        fg.muted = true;
        muted = true;
        try {
          await fg.play();
          uiLayer.style.display = 'none';
          bg.play().catch(() => {});
        } catch (err) {
          // Deadlock recovery timeout
          uiLayer.style.display = 'block';
          fallbackTimeout = setTimeout(() => {
            if (fg.paused && uiLayer.style.display === 'block') {
              ii = (ii + 1) % videoSource.length;
              videoPlay(ii);
            }
          }, 8000);
        }
      }
    }

    container.addEventListener('click', () => {
      uiLayer.style.display = 'none';
        muted = !muted;
        fg.muted = muted;
        flashStatus(fg.muted ? 'off' : 'on');

    });

    const params = getUrlParameters(window.location.search.substr(1));
    if (params.content) {
      videoSource = params.content.split(',').map(url => url.trim()).filter(Boolean);
    }

    fg.addEventListener('ended', () => {
      if (videoSource.length > 0) {
        const nextIndex = (ii + 1) % videoSource.length;
        videoPlay(nextIndex);
      }
    });

    fg.addEventListener('loadedmetadata', updateAspect);
    window.addEventListener('resize', updateAspect);

    if (videoSource.length > 0) {
      videoPlay(ii);
    }
  </script>
</body>
</html>
